spring:
  application:
    name: devshowcase-api-equipe

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devshowcase_api}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false